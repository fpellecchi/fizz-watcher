name: Xior Rotsoord watcher

# Same stint/handover pattern as the Fizz watcher, in its own concurrency
# group so the two run side by side instead of queueing behind each other.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: xior-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch for availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIZZ_HEADLESS: "1"
          FIZZ_MAX_RUNTIME_MINUTES: "50"
          TZ: Europe/Amsterdam
        run: python xior_watcher.py
