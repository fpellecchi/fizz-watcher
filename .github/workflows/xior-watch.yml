name: Xior Rotsoord watcher

# Same stint/handover pattern as the Fizz watcher, in its own concurrency
# group so the two run side by side instead of queueing behind each other.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: xior-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch for availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIZZ_HEADLESS: "1"
          FIZZ_MAX_RUNTIME_MINUTES: "345"
          TZ: Europe/Amsterdam
        run: python xior_watcher.py

      # Instant handover: with a SELF_TRIGGER_TOKEN secret the job queues its
      # own successor, so coverage is continuous instead of waiting for the
      # (heavily delayed) cron tick. Without the secret, cron is the fallback.
      - name: Queue the next run
        if: ${{ always() && env.SELF_TOKEN != '' }}
        env:
          SELF_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
          GH_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
        run: gh workflow run xior-watch.yml -R ${{ github.repository }}
