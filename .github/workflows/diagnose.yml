name: Diagnose site access

# One-shot check of how each housing site responds from a GitHub runner,
# to tell "blocked from datacenter IPs" apart from a code bug.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Xior endpoint
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "Xior POST -> HTTP %{http_code}\n" \
            -X POST "https://www.xiorstudenthousing.eu/wp-admin/admin-ajax.php" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "action=yardi_room_availability&property_page_id=1105&room_type_id=32286&semester_id=3281"

      - name: Plaza feed
        continue-on-error: true
        run: |
          curl -s -o /tmp/plaza.json -w "Plaza feed -> HTTP %{http_code}, %{size_download} bytes\n" \
            "https://plaza.newnewnew.space/portal/object/frontend/getallobjects/format/json" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36" \
            -H "Accept: application/json"

      - name: Holland2Stay
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "Holland2Stay -> HTTP %{http_code}\n" \
            "https://holland2stay.com/residences.html" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36"

      - name: Plaza watcher one-shot
        continue-on-error: true
        env:
          FIZZ_HEADLESS: "1"
        run: python plaza_watcher.py --once
