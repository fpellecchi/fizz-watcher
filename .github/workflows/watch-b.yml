name: Fizz Utrecht watcher (B)

# Fizz watcher, half of a ping-pong pair. When one finishes it triggers the
# other via `workflow_run`, so the handover is immediate and needs no token
# or secret. The cron is only a safety net for when the chain breaks.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Fizz Utrecht watcher"]
    types: [completed]

concurrency:
  group: fizz-watcher
  cancel-in-progress: false

jobs:
  watch:
    # A cancelled run means a human stopped it on purpose - do not restart.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch for availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIZZ_HEADLESS: "1"
          FIZZ_INTERVAL_SECONDS: "2"
          FIZZ_MAX_RUNTIME_MINUTES: "345"
          TZ: Europe/Amsterdam
        run: python fizz_watcher.py

      # Instant handover once a SELF_TRIGGER_TOKEN secret exists: the job
      # queues its successor directly. Without it, the workflow_run chain
      # (a few hops only) and the cron are the fallbacks.
      - name: Queue the next run
        if: ${{ always() && env.SELF_TOKEN != '' }}
        env:
          SELF_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
          GH_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
        run: gh workflow run watch-b.yml -R ${{ github.repository }}
